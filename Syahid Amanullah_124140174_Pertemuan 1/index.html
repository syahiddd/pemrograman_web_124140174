<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini POS - Kasir Kantin Kampus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>🛒 Mini POS</h1>
      <p>Kasir &amp; Keranjang Belanja Kantin Kampus</p>
    </div>
  </header>

  <main class="container layout">
    <!-- ===== Kolom Kiri: Form Input Barang ===== -->
    <section class="card form-card">
      <h2>Input Barang</h2>
      <form id="itemForm" novalidate>
        <div class="form-group">
          <label for="itemName">Nama Barang</label>
          <input type="text" id="itemName" placeholder="cth. Air Mineral" autocomplete="off" />
          <small class="error" id="itemNameError"></small>
        </div>

        <div class="form-group">
          <label for="itemPrice">Harga Satuan (Rp)</label>
          <input type="number" id="itemPrice" placeholder="min. 500" min="500" step="1" />
          <small class="error" id="itemPriceError"></small>
        </div>

        <div class="form-group">
          <label for="itemQty">Jumlah / Qty</label>
          <input type="number" id="itemQty" placeholder="min. 1" min="1" step="1" value="1" />
          <small class="error" id="itemQtyError"></small>
        </div>

        <button type="submit" class="btn btn-primary btn-block">+ Tambah ke Keranjang</button>
        <p class="form-success" id="formSuccess" aria-live="polite"></p>
      </form>
    </section>

    <!-- ===== Kolom Kanan: Keranjang + Pembayaran ===== -->
    <div class="right-col">
      <section class="card">
        <div class="card-head">
          <h2>Keranjang Belanja</h2>
          <span class="badge" id="itemCount">0 item</span>
        </div>
        <div class="table-wrap">
          <table class="cart-table">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Barang</th>
                <th class="num">Harga Satuan</th>
                <th class="num">Qty</th>
                <th class="num">Subtotal</th>
                <th class="center">Aksi</th>
              </tr>
            </thead>
            <tbody id="cartBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card summary-card">
        <h2>Ringkasan Pembayaran</h2>

        <div class="summary-row">
          <span>Total Belanja</span>
          <strong id="totalAmount">Rp 0</strong>
        </div>

        <div class="form-group promo-group">
          <label for="promoCode">Kode Promo <span class="hint">(opsional, cth. HEMAT10)</span></label>
          <input type="text" id="promoCode" placeholder="Masukkan kode promo" autocomplete="off" />
          <small class="info" id="promoInfo"></small>
        </div>

        <div class="summary-row discount">
          <span>Diskon <span id="discountLabel" class="hint"></span></span>
          <strong id="discountAmount">- Rp 0</strong>
        </div>

        <div class="summary-row grand">
          <span>Total Akhir</span>
          <strong id="finalAmount">Rp 0</strong>
        </div>

        <div class="form-group">
          <label for="paymentAmount">Uang Bayar (Rp)</label>
          <input type="number" id="paymentAmount" placeholder="Nominal uang diterima" min="0" step="1" />
        </div>

        <div class="summary-row change">
          <span>Kembalian</span>
          <strong id="changeAmount">Rp 0</strong>
        </div>
        <p class="payment-status" id="paymentStatus" aria-live="polite"></p>

        <button type="button" id="resetBtn" class="btn btn-danger btn-block">⟳ Transaksi Baru</button>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <p>Syahid Amanullah · 124140174 · Praktikum Pemrograman Aplikasi Web RA</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
